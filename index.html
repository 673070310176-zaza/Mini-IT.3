<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wheel of Fortune</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffffff;
            font-family: sans-serif;
        }
        #canvas-container {
            position: relative;
            width: 280px;
            height: 280px;
        }
        canvas {
            width: 100%;
            height: 100%;
        }
        .pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #ff4757;
            z-index: 10;
        }
        #msg {
            margin-top: 10px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>

<div id="canvas-container">
    <div class="pointer"></div>
    <canvas id="wheelCanvas" width="280" height="280"></canvas>
</div>
<div id="msg">กรุณาเพิ่มรายการอาหาร</div>

<script>
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const msgDiv = document.getElementById('msg');
    
    // ตั้งค่าเริ่มต้นเป็นรายการว่างเปล่า (ไม่มีเมนูชาบู/ข้าวมันไก่ติดมาแล้ว)
    let items = [];
    let colors = ["#ffdd59", "#4bc0c0", "#ff6b81", "#36a2eb", "#cc65fe", "#ffce56"];
    let startAngle = 0;
    let isSpinning = false;

    function drawWheel() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if (items.length === 0) {
            ctx.fillStyle = "#e0e0e0";
            ctx.beginPath();
            ctx.arc(140, 140, 130, 0, 2 * Math.PI);
            ctx.fill();
            msgDiv.innerText = "กรุณาเพิ่มรายการอาหาร";
            return;
        }

        msgDiv.innerText = "";
        const arc = (2 * Math.PI) / items.length;

        for (let i = 0; i < items.length; i++) {
            const angle = startAngle + i * arc;
            ctx.fillStyle = colors[i % colors.length];
            ctx.beginPath();
            ctx.arc(140, 140, 130, angle, angle + arc, false);
            ctx.lineTo(140, 140);
            ctx.fill();

            ctx.save();
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 13px sans-serif";
            ctx.translate(140 + Math.cos(angle + arc / 2) * 80, 140 + Math.sin(angle + arc / 2) * 80);
            ctx.rotate(angle + arc / 2 + Math.PI / 2);
            ctx.fillText(items[i], -ctx.measureText(items[i]).width / 2, 0);
            ctx.restore();
        }
    }

    function spin() {
        if (isSpinning || items.length === 0) return;
        isSpinning = true;

        let spinAngleStart = Math.random() * 10 + 20;
        let spinTime = 0;
        let spinTimeTotal = Math.random() * 2000 + 3000;

        function rotateWheel() {
            spinTime += 30;
            if (spinTime >= spinTimeTotal) {
                stopRotateWheel();
                return;
            }
            let spinAngle = spinAngleStart - easeOut(spinTime, 0, spinAngleStart, spinTimeTotal);
            startAngle += (spinAngle * Math.PI / 180);
            drawWheel();
            requestAnimationFrame(rotateWheel);
        }
        rotateWheel();
    }

    function stopRotateWheel() {
        isSpinning = false;
        const degrees = (startAngle * 180 / Math.PI) % 360;
        const arcr = (2 * Math.PI) / items.length;
        const index = Math.floor((360 - degrees) / (arcr * 180 / Math.PI)) % items.length;
        const selectedResult = items[index];

        // ส่งข้อมูลกลับ Thunkable
        const responseData = JSON.stringify({ data: selectedResult });
        if (window.ReactNativeWebView) {
            window.ReactNativeWebView.postMessage(responseData);
        } else if (window.parent) {
            window.parent.postMessage(responseData, "*");
        }
    }

    function easeOut(t, b, c, d) {
        const ts = (t /= d) * t;
        const tc = ts * t;
        return b + c * (tc + -3 * ts + 3 * t);
    }

    // ฟังก์ชันรับข้อความรองรับทุกระบบ (ทั้ง Android/iOS/Web Preview)
    function handleMessage(rawMessage) {
        try {
            let messageData = typeof rawMessage === 'string' ? JSON.parse(rawMessage) : rawMessage;
            
            if (messageData.type === 'SET_LIST') {
                if (Array.isArray(messageData.data)) {
                    items = messageData.data;
                    drawWheel();
                }
            } else if (messageData.type === 'SPIN') {
                spin();
            }
        } catch (e) {
            console.error(e);
        }
    }

    // Event Listeners
    window.addEventListener('message', function(event) {
        handleMessage(event.data);
    });

    document.addEventListener('message', function(event) {
        handleMessage(event.data);
    });

    drawWheel();
</script>

</body>
</html>
