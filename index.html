<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wheel of Fortune</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; margin: 0; padding: 0;
            overflow: hidden; background-color: transparent;
            font-family: sans-serif; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
        }
        #canvas-container {
            position: relative; width: 250px; height: 250px; margin: 0 auto;
        }
        canvas { width: 100%; height: 100%; display: block; }
        .pointer {
            position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 12px solid transparent; border-right: 12px solid transparent;
            border-top: 20px solid #ff4757; z-index: 10;
        }
        #msg { margin-top: 6px; font-size: 13px; color: #888; text-align: center; }
    </style>
</head>
<body>

<div id="canvas-container">
    <div class="pointer"></div>
    <canvas id="wheelCanvas" width="250" height="250"></canvas>
</div>
<div id="msg">กรุณาเพิ่มรายการ</div>

<script>
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const msgDiv = document.getElementById('msg');
    
    let items = [];
    let colors = ["#ffdd59", "#4bc0c0", "#ff6b81", "#36a2eb", "#cc65fe", "#ffce56"];
    let startAngle = 0;
    let isSpinning = false;

    function drawWheel() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if (items.length === 0) {
            ctx.fillStyle = "#e0e0e0";
            ctx.beginPath();
            ctx.arc(125, 125, 115, 0, 2 * Math.PI);
            ctx.fill();
            msgDiv.innerText = "กรุณาเพิ่มรายการ";
            return;
        }

        msgDiv.innerText = "";
        const arc = (2 * Math.PI) / items.length;

        for (let i = 0; i < items.length; i++) {
            const angle = startAngle + i * arc;
            ctx.fillStyle = colors[i % colors.length];
            ctx.beginPath();
            ctx.arc(125, 125, 115, angle, angle + arc, false);
            ctx.lineTo(125, 125);
            ctx.fill();

            ctx.save();
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 13px sans-serif";
            ctx.translate(125 + Math.cos(angle + arc / 2) * 70, 125 + Math.sin(angle + arc / 2) * 70);
            ctx.rotate(angle + arc / 2 + Math.PI / 2);
            ctx.fillText(items[i], -ctx.measureText(items[i]).width / 2, 0);
            ctx.restore();
        }
    }

    function spin() {
        if (isSpinning || items.length === 0) return;
        isSpinning = true;

        let spinAngleStart = Math.random() * 10 + 20;
        let spinTime = 0;
        let spinTimeTotal = Math.random() * 2000 + 3000;

        function rotateWheel() {
            spinTime += 30;
            if (spinTime >= spinTimeTotal) {
                stopRotateWheel();
                return;
            }
            let spinAngle = spinAngleStart - easeOut(spinTime, 0, spinAngleStart, spinTimeTotal);
            startAngle += (spinAngle * Math.PI / 180);
            drawWheel();
            requestAnimationFrame(rotateWheel);
        }
        rotateWheel();
    }

    function stopRotateWheel() {
        isSpinning = false;
        
        const numItems = items.length;
        const arc = (2 * Math.PI) / numItems;

        let degrees = (startAngle * 180 / Math.PI) % 360;
        if (degrees < 0) degrees += 360;

        let arcr = 360 / numItems;
        let index = Math.floor((360 - degrees + 270) / arcr) % numItems;

        const selectedResult = items[index];

        const responseData = JSON.stringify({ data: selectedResult });
        if (window.ReactNativeWebView) {
            window.ReactNativeWebView.postMessage(responseData);
        } else if (window.parent) {
            window.parent.postMessage(responseData, "*");
        }
    }

    function easeOut(t, b, c, d) {
        const ts = (t /= d) * t;
        const tc = ts * t;
        return b + c * (tc + -3 * ts + 3 * t);
    }

    function handleMessage(rawMessage) {
        try {
            let messageData = typeof rawMessage === 'string' ? JSON.parse(rawMessage) : rawMessage;
            
            if (messageData.type === 'SET_LIST') {
                if (Array.isArray(messageData.data)) {
                    items = messageData.data;
                    drawWheel();
                }
            } else if (messageData.type === 'SPIN') {
                spin();
            } else if (messageData.type === 'CLEAR') {
                items = [];
                drawWheel();
            }
        } catch (e) {
            console.error(e);
        }
    }

    window.addEventListener('message', function(event) { handleMessage(event.data); });
    document.addEventListener('message', function(event) { handleMessage(event.data); });

    drawWheel();
</script>

</body>
</html>
