<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wheel of Fortune</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffffff;
            font-family: sans-serif;
        }
        #canvas-container {
            position: relative;
            width: 300px;
            height: 300px;
        }
        canvas {
            width: 100%;
            height: 100%;
        }
        .pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #ff4757;
            z-index: 10;
        }
    </style>
</head>
<body>

<div id="canvas-container">
    <div class="pointer"></div>
    <canvas id="wheelCanvas" width="300" height="300"></canvas>
</div>

<script>
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    
    let items = ["ชาบู", "ข้าวมันไก่", "ส้มตำ"];
    let colors = ["#ffdd59", "#4bc0c0", "#ff6b81", "#36a2eb", "#cc65fe", "#ffce56"];
    let startAngle = 0;
    let isSpinning = false;

    function drawWheel() {
        if (items.length === 0) return;
        const arc = (2 * Math.PI) / items.length;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < items.length; i++) {
            const angle = startAngle + i * arc;
            ctx.fillStyle = colors[i % colors.length];
            ctx.beginPath();
            ctx.arc(150, 150, 140, angle, angle + arc, false);
            ctx.lineTo(150, 150);
            ctx.fill();

            // พิมพ์ตัวอักษร
            ctx.save();
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 14px sans-serif";
            ctx.translate(150 + Math.cos(angle + arc / 2) * 90, 150 + Math.sin(angle + arc / 2) * 90);
            ctx.rotate(angle + arc / 2 + Math.PI / 2);
            ctx.fillText(items[i], -ctx.measureText(items[i]).width / 2, 0);
            ctx.restore();
        }
    }

    function spin() {
        if (isSpinning || items.length === 0) return;
        isSpinning = true;

        let spinAngleStart = Math.random() * 10 + 20;
        let spinTime = 0;
        let spinTimeTotal = Math.random() * 3000 + 4000; // หมุน 4-7 วินาที

        function rotateWheel() {
            spinTime += 30;
            if (spinTime >= spinTimeTotal) {
                stopRotateWheel();
                return;
            }
            let spinAngle = spinAngleStart - easeOut(spinTime, 0, spinAngleStart, spinTimeTotal);
            startAngle += (spinAngle * Math.PI / 180);
            drawWheel();
            requestAnimationFrame(rotateWheel);
        }
        rotateWheel();
    }

    function stopRotateWheel() {
        isSpinning = false;
        const degrees = (startAngle * 180 / Math.PI) % 360;
        const arcr = (2 * Math.PI) / items.length;
        const index = Math.floor((360 - degrees) / (arcr * 180 / Math.PI)) % items.length;
        const selectedResult = items[index];

        // ส่งผลลัพธ์กลับไปยัง Thunkable
        if (window.ReactNativeWebView) {
            window.ReactNativeWebView.postMessage(JSON.stringify({ data: selectedResult }));
        }
    }

    function easeOut(t, b, c, d) {
        const ts = (t /= d) * t;
        const tc = ts * t;
        return b + c * (tc + -3 * ts + 3 * t);
    }

    // รับคำสั่งจาก Thunkable (Post Message)
    window.addEventListener('message', function(event) {
        try {
            let messageData = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
            
            if (messageData.type === 'SET_LIST') {
                if (Array.isArray(messageData.data) && messageData.data.length > 0) {
                    items = messageData.data;
                    drawWheel();
                }
            } else if (messageData.type === 'SPIN') {
                spin();
            }
        } catch (e) {
            console.error(e);
        }
    });

    drawWheel();
</script>

</body>
</html>
